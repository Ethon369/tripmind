<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>途灵 TripMind — AI 智能行程规划</title>
    <!--
      运行时配置。

      为什么需要它:`VITE_*` 变量是**构建期**被编译进产物的,所以按常规做法,
      换一个高德 Key 就得重新构建整个前端镜像。这对"别人拿这个项目跑起来"
      很糟 —— 他会看到地图一片空白,却不知道该改哪儿、更想不到要重新 build。

      这里改成:容器启动时由 nginx 的入口脚本按环境变量生成 `/config.js`,
      页面在加载业务代码**之前**先读它。于是改 Key 只要改环境变量 + 重启容器。

      开发环境(npm run dev)没有这个文件,所以下面这行会 404 —— 无所谓,
      脚本加载失败不会影响后面的 module 脚本,`src/config/runtime.ts`
      会自动回落到 `import.meta.env`。onerror 只是把控制台里的报错消掉。
    -->
    <script src="/config.js" onerror="void 0"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
