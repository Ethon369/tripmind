# 途灵 TripMind —— 前端的容器内 nginx 配置
# (被 COPY 到 /etc/nginx/conf.d/default.conf)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传攻略的原始文件上限。后端自己限 5MB,这里留一倍余量:
    # 卡在后端能回一句人话("文件 xx MB,超过上限 5 MB"),
    # 卡在 nginx 只能回一个 413 页面 —— 用户不知道发生了什么。
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/wasm;

    # ---------------------------------------------------------------
    # 后端 API
    # ---------------------------------------------------------------
    location /api/ {
        # backend 是 docker compose 里的服务名,由内置 DNS 解析
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 这三行是这个项目**必须**调的,不是通用模板抄来的:
        #   生成一次行程要跑 4 次 LLM + 高德 MCP 调用,实测单条 1~2 分钟。
        #   nginx 默认 60s 会直接回 504,而前端还在等 ——
        #   用户看到的是"生成失败",日志里却是超时,很难联想到 nginx。
        #   前端 axios 的超时是 120s,所以这里要大于它,让前端先自己超时
        #   并给出提示,而不是收到一个 nginx 的 504。
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 长请求期间不要把响应攒起来再发
        proxy_buffering off;
    }

    # ---------------------------------------------------------------
    # 运行时配置(容器启动时由入口脚本生成)
    # ---------------------------------------------------------------
    # 不能长缓存:改了环境变量重启容器后,浏览器若还用着旧的 config.js,
    # 表现就是"明明改了 Key 却没生效",而且刷新也没用(强缓存)。
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # 带 hash 的静态资源 —— 内容变了文件名就变,可以长缓存
    # ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # SPA 路由回退
    # ---------------------------------------------------------------
    # /result/:id、/share/:id、/history、/knowledge 都是前端路由,
    # 直接访问或刷新时服务器上并没有这些文件 —— 必须回落到 index.html,
    # 否则分享链接一刷新就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
