[pytest]
; 跑测试的配置。放在 backend/ 下,所以在 backend 目录里直接敲 `pytest` 即可。
;
; 为什么用 .ini 而不是 pyproject.toml:项目里没有 pyproject.toml,
; 为了几行配置新建一个打包配置文件不划算。pytest 原生认 ini。

; 不写路径时默认只找 tests/,避免误扫 venv 里的第三方测试
testpaths = tests

; 让 `-q` 的输出里出现中文时不被转义
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

filterwarnings =
    ; ------------------------------------------------------------------
    ; 下面这条**不是**在掩盖问题,是在降低噪音。
    ;
    ; `app/models/schemas.py` 里写的是 `Field(..., example="北京")`,
    ; 这是 Pydantic V2 的过时写法(官方要求改用 json_schema_extra),
    ; V3 会直接移除 —— 也就是说这是一处**真实待修**的隐患。
    ;
    ; 但它只在 import schemas 时触发一次,却会刷出十几遍完整的
    ; traceback,把真正的失败信息挤出屏幕。所以这里收拢掉,
    ; 并在此处留下记录:集中改一次 schemas.py 之后,这行就可以删了。
    ; ------------------------------------------------------------------
    ignore::pydantic.PydanticDeprecatedSince20
